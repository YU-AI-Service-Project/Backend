name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (Java 25, MySQL 8.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: wattup_test
          MYSQL_USER: wattup
          MYSQL_PASSWORD: ci-only-wattup
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysql --protocol=TCP -h 127.0.0.1 -u wattup -pci-only-wattup wattup_test -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Run Maven verification with MySQL
        env:
          WATTUP_DB_USER: wattup
          WATTUP_DB_PASSWORD: ci-only-wattup
          WATTUP_TEST_DB_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports['3306'] }}/wattup_test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
