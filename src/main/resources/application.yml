spring:
  application:
    name: wattup-backend
  datasource:
    url: "${WATTUP_DB_URL:jdbc:mysql://127.0.0.1:3307/wattup?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}"
    username: "${WATTUP_DB_USER:wattup}"
    password: "${WATTUP_DB_PASSWORD}"
    hikari:
      connection-init-sql: "SET SESSION time_zone = '+00:00'"
  flyway:
    clean-disabled: true
    validate-migration-naming: true
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 3000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true

springdoc:
  api-docs:
    enabled: "${WATTUP_OPENAPI_ENABLED:false}"
  swagger-ui:
    enabled: "${WATTUP_OPENAPI_ENABLED:false}"
    version: "5.35.1"
  paths-to-match: /api/**,/internal/**

wattup:
  auth:
    jwt-secret: "${WATTUP_AUTH_JWT_SECRET:}"
    email-secret: "${WATTUP_AUTH_EMAIL_SECRET:}"
    mail-from: "${WATTUP_AUTH_MAIL_FROM:}"
    kakao-app-id: "${WATTUP_AUTH_KAKAO_APP_ID:}"
    kakao-admin-key: "${WATTUP_AUTH_KAKAO_ADMIN_KEY:}"
    google-client-id: "${WATTUP_AUTH_GOOGLE_CLIENT_ID:}"
  account:
    withdrawal-enabled: "${WATTUP_ACCOUNT_WITHDRAWAL_ENABLED:false}"
  location:
    kakao-rest-api-key: "${WATTUP_KAKAO_LOCAL_REST_API_KEY:}"
  recommendation:
    candidate-limit: "${WATTUP_RECOMMENDATION_CANDIDATE_LIMIT:10}"
  prediction:
    quality-capture-enabled: "${WATTUP_PREDICTION_QUALITY_CAPTURE_ENABLED:false}"
    kakao-rest-api-key: "${WATTUP_KAKAO_REST_API_KEY:}"
    ai-batch-url: "${WATTUP_AI_ETA_BATCH_URL:}"
    ai-bearer-token: "${WATTUP_AI_ETA_BEARER_TOKEN:}"
    ai-feature-version: "${WATTUP_AI_ETA_FEATURE_VERSION:daegu-eta-v4}"
    ai-health-url: "${WATTUP_AI_HEALTH_URL:}"
    ai-health-token: "${WATTUP_AI_HEALTH_TOKEN:}"
  internal:
    allowed-addresses: "${WATTUP_INTERNAL_ALLOWED_ADDRESSES:127.0.0.1,::1}"
    read-token: "${WATTUP_INTERNAL_READ_TOKEN:}"
    write-token: "${WATTUP_INTERNAL_WRITE_TOKEN:}"
    manual-collection-enabled: "${WATTUP_INTERNAL_MANUAL_COLLECTION_ENABLED:false}"
  collection:
    enabled: "${WATTUP_KECO_ENABLED:false}"
    service-key: "${WATTUP_KECO_SERVICE_KEY:}"
    region: "${WATTUP_KECO_REGION:}"
    page-size: "${WATTUP_KECO_PAGE_SIZE:9999}"
    daily-limit: "${WATTUP_KECO_DAILY_LIMIT:1000}"
